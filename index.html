<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Cadeaux | Wholesale</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #050505; --card: #121212; --green: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; padding-bottom: 50px; }
        .navbar { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); text-align: center; position: sticky; top:0; z-index:100; }
        .logo { color:var(--gold); font-weight:bold; font-size:24px; cursor: pointer; text-transform: uppercase; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #222; text-align: center; }
        .img-box { background: #fff; height: 150px; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .details { padding: 10px; }
        .price { color: var(--gold); font-weight: bold; font-size: 18px; margin: 5px 0; }
        .order-btn { background: var(--green); color: white; width: 100%; padding: 8px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        /* Admin Panel */
        #admin-panel { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 20px; overflow-y: auto; }
        .edit-item { background: #111; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--gold); }
        .edit-item input { width: 100%; padding: 10px; margin: 5px 0; background: #222; color: white; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        .admin-btns { position: sticky; bottom: 0; background: #000; padding: 10px 0; display: flex; gap: 10px; }
        .save-btn { background: var(--gold); color: black; flex: 2; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .close-btn { background: #444; color: white; flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar"><div class="logo" onclick="adminTrigger()">TOP CADEAUX 🎁</div></nav>

<div class="container">
    <div class="grid" id="main-grid">
        </div>
</div>

<div id="admin-panel">
    <h2 style="color:var(--gold)">لوحة التحكم ⚙️</h2>
    <p style="font-size: 12px; color: #888;">عمر السمية، رابط الصورة، والثمن. (الثمن 0 يعني السلعة مخفية)</p>
    <div id="edit-area"></div>
    <div class="admin-btns">
        <button class="save-btn" onclick="saveToFirebase()">حفظ التغييرات ✅</button>
        <button class="close-btn" onclick="closeAdmin()">إغلاق</button>
    </div>
</div>

<script>
    // معلومات Firebase الخاصة بك (يحيى)
    const firebaseConfig = {
        apiKey: "AIzaSyBb1FQI83PJh77Iq2i74xIjs0qB0RrUPu4",
        authDomain: "top-cadeaux-24b7a.firebaseapp.com",
databaseURL: "https://top-cadeaux-24b7a-default-rtdb.firebaseio.com",
        projectId: "top-cadeaux-24b7a",
        storageBucket: "top-cadeaux-24b7a.firebasestorage.app",
        messagingSenderId: "703701346169",
        appId: "1:703701346169:web:b14546cd7fe4e00b9431a8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let products = [];

    // جلب البيانات مباشرة من Firebase
    db.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            products = data;
            render();
        } else {
            // أول مرة: إنشاء 100 مكان فارغ
            products = Array.from({length: 100}, (_, i) => ({
                id: i, name: "", price: 0, img: "https://via.placeholder.com/150"
            }));
            db.ref('products').set(products);
        }
    });

    function render() {
        const grid = document.getElementById('main-grid');
        // عرض السلعة اللي ثمنها أكبر من 0 فقط
        const activeProducts = products.filter(p => p.price > 0);
        
        if(activeProducts.length === 0) {
            grid.innerHTML = "<p style='text-align:center; width:100%; color:#666;'>المتجر فارغ حالياً. اضغط على اللوغو لإضافة سلع.</p>";
            return;
        }

        grid.innerHTML = activeProducts.map(p => `
            <div class="product-card">
                <div class="img-box"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'"></div>
                <div class="details">
                    <h3 style="font-size:14px; margin:5px 0;">${p.name}</h3>
                    <div class="price">${p.price} DH</div>
                    <button class="order-btn" onclick="order('${p.name}', ${p.price})">
                        <i class="fab fa-whatsapp"></i> طلب الآن
                    </button>
                </div>
            </div>
        `).join('');
    }

    function order(name, price) {
        const phone = "212631491234"; // رقم واتساب
        const msg = encodeURIComponent(`السلام عليكم، بغيت نطلب:\nالمنتج: ${name}\nالثمن: ${price} DH`);
        window.open(`https://wa.me/${phone}?text=${msg}`);
    }

    // نظام الدخول للآدمين
    let clicks = 0;
    function adminTrigger() {
        clicks++;
        if(clicks === 5) {
            if(prompt("كلمة المرور:") === "top@2030") openAdmin();
            clicks = 0;
        }
        setTimeout(() => clicks = 0, 3000);
    }

    function openAdmin() {
        document.getElementById('admin-panel').style.display = 'block';
        const area = document.getElementById('edit-area');
        area.innerHTML = products.map((p, i) => `
            <div class="edit-item">
                <strong>المنتج رقم ${i+1}</strong>
                <input type="text" id="n-${i}" value="${p.name}" placeholder="اسم المنتج">
                <input type="text" id="img-${i}" value="${p.img}" placeholder="رابط الصورة">
                <input type="number" id="p-${i}" value="${p.price}" placeholder="الثمن (DH)">
            </div>
        `).join('');
    }

    function saveToFirebase() {
        const updated = products.map((p, i) => ({
            id: i,
            name: document.getElementById(`n-${i}`).value,
            img: document.getElementById(`img-${i}`).value,
            price: parseFloat(document.getElementById(`p-${i}`).value) || 0
        }));

        db.ref('products').set(updated).then(() => {
            alert("تم الحفظ بنجاح! السلعة غتبان عند كاع الناس دابا.");
            closeAdmin();
        }).catch(err => alert("خطأ: تأكد من تفعيل Realtime Database في Firebase"));
    }

    function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
</script>
</body>

</html>
